name: Build APK

# ملف واحد يكفي: يحمل المشروع كاملاً بداخله ويستعيده تلقائياً إن لم تكن ملفاته في المستودع.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW VERSION: 3 (always-restore)"
          if [ -f .use-repo-sources ]; then
            echo "Using sources from the repository (.use-repo-sources found)."
          else
            echo "Restoring embedded project (overwrites lib/ and pubspec.yaml)."
            rm -rf lib
