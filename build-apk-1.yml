name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# أي تشغيل جديد يلغي التشغيلات الأقدم لنفس الفرع (يمنع تراكم عشرات التشغيلات)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Repo root contents:"; ls -la
          test -f pubspec.yaml || { echo "::error::pubspec.yaml غير موجود في جذر المستودع"; exit 1; }
          test -f lib/main.dart || { echo "::error::lib/main.dart غير موجود (مجلد lib لم يُرفع)"; exit 1; }
          test -f lib/db.dart || { echo "::error::lib/db.dart غير موجود"; exit 1; }
          test -d lib/screens || { echo "::error::lib/screens غير موجود"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name attendance_qr --org com.attendance.qr .
          rm -rf test
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter\.minSdkVersion/23/' "$f"
            fi
          done
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$M"
          fi
          sed -i 's#android:label="[^"]*"#android:label="حضور الطلاب"#' "$M"

      - name: Get packages
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-qr-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
